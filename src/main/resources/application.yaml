spring:
  application:
    name: account

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    schemas: accounts

  jpa:
    properties:
      hibernate:
        default_schema: accounts

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    cache-names: accounts # created at startup: only caches that exist then get metrics
    redis:
      time-to-live: 300000    # 5 minutes in milliseconds
      cache-null-values: false
      enable-statistics: true # exports cache_gets_total{result="hit|miss"} to Prometheus

management:
  endpoints:
    web:
      base-path: /accounts/actuator # under the service prefix: /accounts/actuator/prometheus
      exposure:
        include: ['prometheus']     # only the metrics endpoint is opened